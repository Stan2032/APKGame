name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run engine tests (determinism, PVP verification, generator)
        run: ./gradlew :core:test

      - name: Run app tests (screen smoke tests, match state machine)
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Build release AAB (Play upload artifact)
        run: ./gradlew :app:bundleRelease

      - name: Build release APK (sideload testing)
        run: ./gradlew :app:assembleRelease

      - name: Audit release APK (permissions allowlist, R8 keep rules, size)
        run: python3 tools/verify_release_apk.py

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gravity-gambit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: gravity-gambit-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: gravity-gambit-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/
